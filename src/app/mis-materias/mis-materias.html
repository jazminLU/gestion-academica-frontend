<div class="page-container">

  <div class="page-header">
    <h2 class="page-title">Mis materias</h2>
    <button mat-raised-button class="btn-gradient" (click)="solicitarInscripcion()">
      <mat-icon>add</mat-icon>
      Solicitar inscripción
    </button>
  </div>

  <div class="panel">

    <div class="table-wrapper">
    <table mat-table [dataSource]="inscripciones" class="full-width">

      <ng-container matColumnDef="materia">
        <th mat-header-cell *matHeaderCellDef> Materia </th>
        <td mat-cell *matCellDef="let i"> {{ i.materiaNombre }} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let i">
          <span class="estado-chip" [ngClass]="'estado-' + i.estado.toLowerCase()">{{ i.estado }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef> Fecha de solicitud </th>
        <td mat-cell *matCellDef="let i"> {{ i.fechaSolicitud | date:'dd/MM/yyyy HH:mm' }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    </div>

    <div *ngIf="inscripciones.length === 0" class="empty-state">
      Todavía no estás inscripto en ninguna materia. ¡Solicitá la primera!
    </div>

  </div>

</div>
