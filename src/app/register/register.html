<div class="auth-page">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>

  <div class="auth-card">
    <h2>Crear cuenta</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">

      <label class="field">
        <span class="field-label">Nombre</span>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="nuevoUsuario.nombre"
          autocomplete="name"
          placeholder="Tu nombre"
          required>
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="nuevoUsuario.email"
          autocomplete="email"
          placeholder="tu@email.com"
          required>
      </label>

      <label class="field">
        <span class="field-label">Contraseña</span>
        <div class="input-wrap">
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="nuevoUsuario.password"
            autocomplete="new-password"
            placeholder="••••••••"
            required>
          <button type="button" class="toggle-pw" (click)="togglePassword()" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12Z" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 3l18 18" stroke-linecap="round"/>
              <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10.5 7 10.5 7a13.6 13.6 0 0 1-3.4 4.2M6.6 6.6C3.4 8.5 1.5 12 1.5 12s4 7 10.5 7a10.4 10.4 0 0 0 4.9-1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </label>

      <button type="submit" class="auth-submit" [disabled]="!registerForm.valid || cargando">
        <span *ngIf="!cargando">Registrarse</span>
        <span *ngIf="cargando" class="spinner"></span>
      </button>
    </form>

    <p class="auth-switch">¿Ya tenés cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
