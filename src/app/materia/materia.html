<div class="page-header">
  <h2 class="page-title">Materias</h2>
  <button *ngIf="authService.isAdmin()" mat-raised-button class="btn-gradient" (click)="agregarMateria()">
    <mat-icon>add</mat-icon>
    Nueva materia
  </button>
</div>

<div class="panel">

  <div class="filter-bar">
    <mat-form-field appearance="outline">
      <mat-label>Buscar por nombre</mat-label>
      <input matInput [(ngModel)]="filtroNombre" (keyup.enter)="buscar()" placeholder="Ej: Matemática">
    </mat-form-field>
    <button mat-stroked-button color="primary" (click)="buscar()">
      <mat-icon>search</mat-icon> Buscar
    </button>
  </div>

  <div class="table-wrapper">
  <table mat-table [dataSource]="materias" class="full-width">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let materia"> {{ materia.id }} </td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let materia"> {{ materia.nombre }} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let materia" class="acciones-cell">
        <button mat-stroked-button color="primary" (click)="editarMateria(materia)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-stroked-button color="warn" (click)="eliminar(materia)">
          <mat-icon>delete</mat-icon> Eliminar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  </div>

  <div *ngIf="materias.length === 0" class="empty-state">
    No hay materias registradas. ¡Agregá la primera!
  </div>

  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPageChange($event)">
  </mat-paginator>

</div>
