<div class="page-header">
  <h2 class="page-title">Solicitudes pendientes</h2>
</div>

<div class="panel">

  <div class="table-wrapper">
  <table mat-table [dataSource]="pendientes" class="full-width">

    <ng-container matColumnDef="alumno">
      <th mat-header-cell *matHeaderCellDef> Alumno </th>
      <td mat-cell *matCellDef="let i"> {{ i.alumnoNombre }} </td>
    </ng-container>

    <ng-container matColumnDef="materia">
      <th mat-header-cell *matHeaderCellDef> Materia </th>
      <td mat-cell *matCellDef="let i"> {{ i.materiaNombre }} </td>
    </ng-container>

    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef> Fecha de solicitud </th>
      <td mat-cell *matCellDef="let i"> {{ i.fechaSolicitud | date:'dd/MM/yyyy HH:mm' }} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let i" class="acciones-cell">
        <button mat-stroked-button color="primary" (click)="aprobar(i)">
          <mat-icon>check</mat-icon> Aprobar
        </button>
        <button mat-stroked-button color="warn" (click)="rechazar(i)">
          <mat-icon>close</mat-icon> Rechazar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  </div>

  <div *ngIf="pendientes.length === 0" class="empty-state">
    No hay solicitudes pendientes por el momento.
  </div>

</div>
